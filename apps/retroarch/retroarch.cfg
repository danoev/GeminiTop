# retroarch.cfg — Pre-configured for Gemini SP7021 head unit
# All paths relative to the retroarch.cfg location (USB stick root/apps/retroarch/)

# --- Video (Gemini framebuffer driver) ---
video_driver = "gemini"
video_fullscreen = "true"
video_vsync = "false"
video_threaded = "false"
video_smooth = "false"
video_scale = "1.000000"
video_aspect_ratio_auto = "true"
video_font_enable = "false"
fps_show = "false"

# --- Audio (Gemini direct libaudio -> QtOutput) ---
audio_driver = "gemini"
audio_enable = "true"
audio_rate_control = "true"
audio_rate_control_delta = "0.005"
audio_max_timing_skew = "0.05"
audio_latency = "64"
audio_out_rate = "48000"

# --- Input (Gemini evdev driver) ---
input_driver = "gemini"
input_joypad_driver = "null"
input_max_users = "2"
input_poll_type_behavior = "0"

# Controller hotkey combos (no keyboard needed to exit)
# Combo 2 = L1+R1+Start+Select to toggle menu
input_menu_toggle_gamepad_combo = "2"
# Combo 3 = L1+R1+Start+Select+L2+R2 to exit RetroArch
input_exit_emulator_gamepad_combo = "3"

# Keyboard fallback (when gamepad not connected)
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"
input_player1_a = "x"
input_player1_b = "z"
input_player1_x = "s"
input_player1_y = "a"
input_player1_l = "q"
input_player1_r = "w"
input_player1_start = "enter"
input_player1_select = "rshift"

# --- Menu (RGUI — lightweight software-rendered menu) ---
menu_driver = "rgui"
menu_enable_widgets = "false"
menu_show_sublabels = "false"
menu_horizontal_animation = "false"
menu_thumbnails = "0"
menu_left_thumbnails = "0"
menu_rgui_shadows = "false"
menu_rgui_transparency = "false"
rgui_switch_icons = "false"
rgui_browser_directory = "roms"


# --- Paths (all relative to USB stick) ---
libretro_directory = "cores"
system_directory = "system"
savefile_directory = "saves"
savestate_directory = "states"
content_history_path = "history.lpl"
content_history_size = "50"

# --- Performance tuning (1GHz single-core ARM) ---
rewind_enable = "false"
video_frame_delay = "0"
video_hard_sync = "false"
audio_sync = "true"
fastforward_ratio = "2.0"

# --- Core defaults ---
# PS1 (PCSX-ReARMed) — frameskip helps on demanding games
pcsx_rearmed_frameskip_type = "auto"
pcsx_rearmed_frameskip = "1"
pcsx_rearmed_drc = "enabled"
pcsx_rearmed_neon_interlace_enable = "disabled"
pcsx_rearmed_neon_enhancement_enable = "disabled"

# --- Misc ---
pause_nonactive = "false"
config_save_on_exit = "false"
log_verbosity = "true"
