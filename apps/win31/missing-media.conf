[sdl]
fullscreen        = true
fulldouble        = false
fullresolution    = original
windowresolution  = original
output            = surface
videodriver       = dummy
autolock          = false
autolock_feedback = none
waitonerror       = false
priority          = highest,normal
mapperfile        = runtime/win31.map
showmenu          = false

[dosbox]
title             = Windows 3.1
machine           = svga_et4000
memsize           = 16

[render]
aspect            = true
scaler            = none

[mixer]
rate              = 22050
blocksize         = 1024
prebuffer         = 20

[midi]
mpu401            = none

[sblaster]
sbtype            = sb16

[gus]
gus               = false

[autoexec]
@ECHO OFF
MOUNT C runtime/drive_c
C:
CLS
TYPE README.TXT
