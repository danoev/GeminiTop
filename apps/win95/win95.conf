[sdl]
fullscreen        = true
fulldouble        = false
fullresolution    = original
windowresolution  = original
output            = surface
videodriver       = dummy
autolock          = false
autolock_feedback = none
waitonerror       = false
priority          = highest,normal
mapperfile        = runtime/win95.map
showmenu          = false

[dosbox]
title             = Windows 95
machine           = svga_s3
memsize           = 64
vmemsize          = 8

[render]
frameskip         = 0
aspect            = true
scaler            = none

[cpu]
core               = normal
cputype            = pentium_mmx
cycles             = auto
apmbios            = true
isapnpbios         = true
integration device = true

[keyboard]
aux               = true
auxdevice         = intellimouse

[mixer]
rate              = 22050
blocksize         = 1024
prebuffer         = 20

[midi]
mpu401            = none

[sblaster]
sbtype            = sb16

[gus]
gus               = false

[joystick]
joysticktype      = none

[ipx]
ipx               = false

[dos]
ver               = 7.1
xms               = true
ems               = false
umb               = true

[autoexec]
@ECHO OFF
IMGMOUNT 2 images/system.img -t hdd -fs none
BOOT 2
