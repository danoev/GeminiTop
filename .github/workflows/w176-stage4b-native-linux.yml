name: W176 Stage-4B frozen native-Linux verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out workflow revision with full candidate history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact frozen candidate on native Linux
        shell: bash
        run: |
          bash tools/w176-stage4b-capability-probe/verify_native_linux.sh \
            "$RUNNER_TEMP/w176-stage4b-verification/linux-verification"

      - name: Preserve complete verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w176-stage4b-f02c89e-native-linux
          path: ${{ runner.temp }}/w176-stage4b-verification/linux-verification/
          if-no-files-found: error
          retention-days: 30
